name: Codex targeted compression fuzz

on:
  workflow_dispatch:

jobs:
  fuzz-compression:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        compression: [BZIP2, COMPRESS, GZIP, XZ]
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake clang libbz2-dev libext2fs-dev liblzma-dev libssl-dev ncompress zlib1g-dev

      - name: Build instrumented ${{ matrix.compression }} reader
        run: |
          autoreconf -fi
          CC=clang CFLAGS='-O1 -g -fno-omit-frame-pointer -fsanitize=fuzzer-no-link,address,undefined' ./configure
          make -j2 libarchive/libarchive.a
          clang -O1 -g -fno-omit-frame-pointer \
            -fsanitize=fuzzer,address,undefined \
            -DFUZZ_COMPRESSION_${{ matrix.compression }} \
            -I. -Ilibarchive fuzz-native/archive_fuzzer.c \
            libarchive/libarchive.a -lbz2 -lz -llzma \
            -o fuzz-native/archive-fuzzer

      - name: Generate compressed seeds
        run: |
          mkdir -p fuzz-native/corpus fuzz-native/artifacts fuzz-native/seed-work
          curl -fsSL https://raw.githubusercontent.com/libarchive/libarchive/master/contrib/oss-fuzz/corpus.zip -o /tmp/libarchive-corpus.zip
          unzip -j /tmp/libarchive-corpus.zip -d fuzz-native/corpus
          curl -fsSL https://raw.githubusercontent.com/libarchive/libarchive/master/contrib/oss-fuzz/libarchive_filter_fuzzer.dict -o fuzz-native/libarchive.dict
          python3 - <<'PY'
          import bz2, gzip, io, lzma, pathlib, tarfile
          root = pathlib.Path('fuzz-native/corpus')
          payload = b'Tarsnap targeted compression seed\n' * 16
          tar_path = pathlib.Path('fuzz-native/seed-work/sample.tar')
          with tarfile.open(tar_path, 'w') as tf:
              info = tarfile.TarInfo('seed.txt')
              info.size = len(payload)
              tf.addfile(info, io.BytesIO(payload))
          tar_data = tar_path.read_bytes()
          (root / 'sample.tar.bz2').write_bytes(bz2.compress(tar_data))
          (root / 'sample.tar.gz').write_bytes(gzip.compress(tar_data))
          (root / 'sample.tar.xz').write_bytes(lzma.compress(tar_data))
          PY
          compress -c fuzz-native/seed-work/sample.tar > fuzz-native/corpus/sample.tar.Z

      - name: Fuzz ${{ matrix.compression }} under ASan and UBSan
        continue-on-error: true
        run: |
          set +e
          timeout 15m fuzz-native/archive-fuzzer \
            -fork=2 \
            -ignore_crashes=1 \
            -ignore_ooms=1 \
            -ignore_timeouts=1 \
            -max_len=2097152 \
            -rss_limit_mb=4096 \
            -timeout=20 \
            -dict=fuzz-native/libarchive.dict \
            -artifact_prefix=fuzz-native/artifacts/ \
            fuzz-native/corpus > fuzz-native/fuzz.log 2>&1
          echo "$?" > fuzz-native/fuzz.exit
          tail -200 fuzz-native/fuzz.log

      - name: Upload ${{ matrix.compression }} evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarsnap-${{ matrix.compression }}-fuzz-evidence
          path: |
            fuzz-native/artifacts/
            fuzz-native/fuzz.log
            fuzz-native/fuzz.exit
          if-no-files-found: warn
          retention-days: 7
